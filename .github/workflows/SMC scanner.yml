name: Deriv SMC Scanner

on:
  schedule:
    # Runs every 5 minutes. 1 minute might be too frequent for GitHub Actions 
    # and could lead to concurrency issues with the git push.
    - cron: '*/5 * * * *'
  workflow_dispatch:

# Prevent multiple instances of the scanner from running at the same time
concurrency:
  group: smc-scanner
  cancel-in-progress: true

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    # Required for the "git push" step to work
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas websockets

      - name: Run SMC Scanner
        env:
          TG_TOKEN:   ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        # Ensure live_mode is set to False in your script for this to work correctly
        run: python smc_scalper.py

      - name: Save cooldown file
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          # Only commit if the cooldown file actually changed
          if [ -f smc_cooldown.json ]; then
            git add smc_cooldown.json
            git diff --staged --quiet || (git commit -m "Update SMC cooldown" && git push)
          fi
