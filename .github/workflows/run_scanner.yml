name: Deriv SMC Scanner

on:
  schedule:
    - cron: '* * * * *'
  workflow_dispatch:

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas websockets

      - name: Run SMC Scanner
        env:
          TG_TOKEN:   ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python smc_scalper.py

      - name: Save cooldown file
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add smc_cooldown.json || true
          git diff --staged --quiet || git commit -m "Update SMC cooldown"
          git push || true

