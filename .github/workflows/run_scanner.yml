name: Deriv Synthetics Auto Scanner

on:
  schedule:
    # Runs automatically every 30 minutes, 24/7 (Synthetic indices never close!)
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allows you to press a button and force-run it manually

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    steps:
    - name: Download Repository Code
      uses: actions/checkout@v4

    - name: Initializing Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Installing Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Running SMC Algorithm
      env:
        DERIV_APP_ID: ${{ secrets.DERIV_APP_ID }} # Dynamic injection of App ID
      run: python main.py
      
