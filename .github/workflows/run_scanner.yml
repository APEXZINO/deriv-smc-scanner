name: Deriv SMC Scanner

on:
  schedule:
    - cron: '*/5 * * * *'   # runs every 5 minutes, 24/7
  workflow_dispatch:          # also allows manual trigger from GitHub

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 3        # kills the job if it hangs past 3 min

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas websockets

      - name: Run SMC Scanner
        run: python smc_scalper.py

